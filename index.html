<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadir Hero - Sistem Kehadiran Gamifikasi</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-12">

    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-trophy text-yellow-300 text-2xl animate-bounce"></i>
                <span class="font-bold text-xl tracking-wide">HADIR HERO</span>
            </div>
            <span class="text-xs bg-blue-700 px-3 py-1 rounded-full border border-blue-400">Mod Pelajar</span>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

        <section class="bg-white rounded-2xl shadow-sm p-5 border border-slate-100">
            <div class="flex items-center space-x-4">
                <div class="w-16 h-16 bg-gradient-to-tr from-blue-400 to-green-400 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-inner">
                    MH
                </div>
                <div class="flex-1">
                    <h2 class="font-bold text-lg text-slate-900" id="student-name">Muhammad Harith</h2>
                    <p class="text-sm text-slate-500">Kelas: 5 Cemerlang</p>
                    <p class="text-xs text-slate-400">ID: MY-99231</p>
                </div>
                <div class="text-center bg-amber-50 border border-amber-200 p-3 rounded-xl min-w-[80px]">
                    <i class="fa-solid fa-star text-amber-500 text-lg mb-1"></i>
                    <p class="text-xs text-amber-700 font-medium uppercase tracking-wider">Mata</p>
                    <p class="text-xl font-black text-amber-600" id="total-points">120</p>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-slate-100">
                <div class="flex justify-between text-xs text-slate-500 mb-1">
                    <span>Lencana Seterusnya: <b>Warrior 7 Hari</b></span>
                    <span id="streak-text">4/5 Hari</span>
                </div>
                <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div class="bg-emerald-500 h-full rounded-full transition-all duration-500" id="streak-bar" style="width: 80%"></div>
                </div>
            </div>
        </section>

        <section class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 shadow-lg">
            <div class="flex items-center space-x-2 mb-3">
                <i class="fa-solid fa-qrcode text-green-400"></i>
                <h3 class="font-bold text-sm uppercase tracking-wider text-slate-300">Imbas QR Code Kehadiran</h3>
            </div>
            <p class="text-xs text-slate-400 mb-4">Gunakan kamera anda untuk mengimbas QR Code kehadiran yang disediakan oleh guru.</p>
            
            <button onclick="openQRScanner()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] transition-all text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 shadow-md shadow-emerald-900/30">
                <i class="fa-solid fa-camera"></i>
                <span>Buka Imbas QR</span>
            </button>

            <div id="scan-feedback" class="mt-3 text-center text-sm font-semibold hidden p-2 rounded-lg"></div>
        </section>

    </main>

    <!-- QR Scanner Modal -->
    <div id="qrModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-slate-900">Imbas QR Code</h3>
                <button onclick="closeQRScanner()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="mb-4">
                <video id="qrVideo" class="w-full rounded-lg bg-slate-900" playsinline></video>
            </div>

            <canvas id="qrCanvas" class="hidden"></canvas>

            <div id="qrResult" class="hidden text-center p-4 bg-emerald-50 border border-emerald-200 rounded-lg">
                <i class="fa-solid fa-check-circle text-emerald-500 text-2xl mb-2"></i>
                <p class="text-sm text-emerald-700 font-semibold">QR Code Berjaya Diimbas!</p>
                <p class="text-xs text-emerald-600 mt-1" id="resultText"></p>
            </div>

            <button onclick="closeQRScanner()" class="w-full mt-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-lg">
                Tutup
            </button>
        </div>
    </div>

    <script>
        let qrStream = null;
        let scanningActive = false;

        async function openQRScanner() {
            const modal = document.getElementById('qrModal');
            const video = document.getElementById('qrVideo');
            const resultDiv = document.getElementById('qrResult');
            
            modal.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            scanningActive = true;

            try {
                qrStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = qrStream;
                video.play();
                scanQRCode();
            } catch (err) {
                alert('Tidak dapat mengakses kamera. Sila pastikan anda memberi kebenaran akses kamera.');
                closeQRScanner();
            }
        }

        function closeQRScanner() {
            const modal = document.getElementById('qrModal');
            const video = document.getElementById('qrVideo');
            
            scanningActive = false;
            modal.classList.add('hidden');

            if (qrStream) {
                qrStream.getTracks().forEach(track => track.stop());
                qrStream = null;
            }
            video.pause();
        }

        function scanQRCode() {
            const video = document.getElementById('qrVideo');
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const scanFrame = () => {
                if (!scanningActive) return;

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    handleQRResult(code.data);
                    scanningActive = false;
                } else {
                    requestAnimationFrame(scanFrame);
                }
            };

            requestAnimationFrame(scanFrame);
        }

        function handleQRResult(data) {
            const resultDiv = document.getElementById('qrResult');
            const resultText = document.getElementById('resultText');
            const video = document.getElementById('qrVideo');
            
            video.pause();
            resultDiv.classList.remove('hidden');
            resultText.textContent = `Kod: ${data}`;

            // Simulasi kehadiran dicatat
            updateAttendancePoints();
        }

        function updateAttendancePoints() {
            const pointsElement = document.getElementById('total-points');
            const streakElement = document.getElementById('streak-text');
            const streakBar = document.getElementById('streak-bar');
            
            let currentPoints = parseInt(pointsElement.textContent);
            currentPoints += 10;
            pointsElement.textContent = currentPoints;

            // Update streak
            let streakMatch = streakElement.textContent.match(/(\d+)\/(\d+)/);
            if (streakMatch) {
                let current = parseInt(streakMatch[1]);
                let total = parseInt(streakMatch[2]);
                
                if (current < total) {
                    current += 1;
                    streakElement.textContent = `${current}/${total} Hari`;
                    streakBar.style.width = (current / total * 100) + '%';
                }
            }

            // Show feedback
            showFeedback('Kehadiran berjaya dicatat! +10 mata');
        }

        function showFeedback(message) {
            const feedback = document.getElementById('scan-feedback');
            feedback.textContent = message;
            feedback.classList.remove('hidden');
            feedback.classList.add('bg-emerald-100', 'text-emerald-700', 'border', 'border-emerald-300');
            
            setTimeout(() => {
                feedback.classList.add('hidden');
            }, 3000);
        }
    </script>

</body>
</html>
